# Redirect oram.cz → vojtechoram.cz
server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;
    server_name oram.cz www.oram.cz vojtech.oram.cz;

    ssl_certificate /etc/letsencrypt/live/oram.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oram.cz/privkey.pem;

    return 301 https://vojtechoram.cz$request_uri;
}

# Redirect www → non-www
server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;
    server_name www.vojtechoram.cz;

    ssl_certificate /etc/letsencrypt/live/vojtechoram.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vojtechoram.cz/privkey.pem;

    return 301 https://vojtechoram.cz$request_uri;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vojtechoram.cz;

    return 301 https://vojtechoram.cz$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vojtechoram.cz;

    ssl_certificate /etc/letsencrypt/live/vojtechoram.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vojtechoram.cz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/vojtechoram.cz/chain.pem;

    root /www/vojtechoram-new/dist;
    index index.html;

    # Clean URLs — Astro generates /page/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Custom 404
    error_page 404 /404.html;
}
